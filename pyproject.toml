[project]
name = "loopcutter"
version = "0.1.0"
description = "Cut sample-accurate loops out of full tracks, driven by a manifest, for live loop-based sets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Smiles" }]
keywords = ["audio", "loops", "sampling", "dj", "ableton", "live-performance"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
verify = ["librosa>=0.10"]
stems = ["demucs>=4.0"]
sheets = ["openpyxl>=3.1"]
dev = ["pytest>=7.0"]

[project.scripts]
loopcutter = "loopcutter.cli:main"

[project.urls]
Repository = "https://github.com/aaronlsmiles/loopcutter"
Issues = "https://github.com/aaronlsmiles/loopcutter/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
