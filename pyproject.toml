[project]
name = "loopcutter"
version = "0.2.0"
description = "Cut sample-accurate loops out of full tracks, driven by a manifest, for live loop-based sets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Smiles" }]
keywords = ["audio", "loops", "sampling", "dj", "ableton", "live-performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "soxr>=0.3",
    "mutagen>=1.47",
]

[project.optional-dependencies]
analysis = ["beat-this>=1.1", "librosa>=0.10"]
markers = ["pyrekordbox>=0.4", "serato-tools>=4.0"]
verify = ["librosa>=0.10"]
stems = ["audio-separator[cpu]>=0.47", "audioread>=3.0"]     # 0.47 needs both but declares neither
sheets = ["openpyxl>=3.1"]
dev = ["pytest>=7.0"]

[project.scripts]
loopcutter = "loopcutter.cli:main"

[project.urls]
Repository = "https://github.com/aaronlsmiles/loopcutter"
Issues = "https://github.com/aaronlsmiles/loopcutter/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: needs model weights or generated media; run with -m slow"]
addopts = "-m 'not slow'"
